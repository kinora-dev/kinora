# kinora self-host: Postgres + server (local-FS artifacts) + web (single-origin reverse proxy).
# Run from this directory:
#   cp .env.example .env     # then edit PUBLIC_URL, AUTH_SECRET, POSTGRES_PASSWORD
#   docker compose up -d
#   open $PUBLIC_URL
#
# The images are prebuilt and pulled from GHCR, so nothing is compiled here. To build them from a
# repo checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Everything is one origin: the web container serves the dashboard and proxies the API to the
# server, so there's no CORS or cross-subdomain cookie setup. Artifacts live on a local volume
# (no S3 needed). See README.md.
name: kinora-selfhost

# migrate and server run the same image and config; only their command and lifecycle differ.
x-server: &server
  image: ghcr.io/kinora-dev/kinora-server:${KINORA_VERSION:-latest}
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    BASE_URL: ${PUBLIC_URL}
    WEB_ORIGIN: ${PUBLIC_URL}

services:
  postgres:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - kinora-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations, then exit. The server waits for it to finish.
  migrate:
    <<: *server
    command: [node, dist/scripts/migrate.mjs, latest]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *server
    restart: unless-stopped
    volumes:
      - kinora-artifacts:/app/.data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    # Serves the dashboard + trace viewer and proxies /api, /trpc, /artifacts to the server. The
    # dashboard talks to its own origin, so no build-time URL and no rebuild when PUBLIC_URL changes.
    image: ghcr.io/kinora-dev/kinora-web:${KINORA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - server

volumes:
  kinora-db:
  kinora-artifacts:
