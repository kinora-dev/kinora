# Self-host single-origin: serve the dashboard + trace viewer, and reverse-proxy the
# API to the server container so everything is one origin (no CORS, no cross-subdomain cookie).
server {
  listen 80;
  server_name _;
  client_max_body_size 100m; # trace.zip uploads

  # API (ingest, auth, slack), tRPC, and artifacts -> server container.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /trpc/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /artifacts/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_buffering off; # stream trace.zip + honor Range
  }
  location = /healthcheck {
    proxy_pass http://server:3000;
  }

  # Private dashboard, not content: keep it out of search indexes. Search Console
  # showed demo/app run URLs indexed as thin pages. Exact match wins over `location /`.
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # TLS terminates upstream, so an absolute Location would downgrade to http.
  absolute_redirect off;

  # Bare /trace -> /trace/ (the viewer is served with base /trace/).
  location = /trace {
    return 301 /trace/;
  }

  # Embedded trace viewer (built with base /trace/: its own index, assets, sw).
  location /trace/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /trace/index.html;
    # Viewer renders untrusted recorded content in sandboxed iframes + a SW that range-fetches
    # the trace zip; resource directives stay open, only harden the rest.
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Web hashed assets - immutable, long cache.
  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Web SPA - vue-router history fallback.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # Single origin: API is proxied same-origin (connect 'self'). img https: = social-login avatars.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
