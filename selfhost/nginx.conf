# Self-host single-origin: serve the dashboard + trace viewer, and reverse-proxy the
# API to the server container so everything is one origin (no CORS, no cross-subdomain cookie).
server {
  listen 80;
  server_name _;
  client_max_body_size 100m; # trace.zip uploads

  # Resolve the server through Docker's DNS on each request (cached 10s) instead of once at boot:
  # a recreated or rolled-out server container gets a new IP, which a static upstream never sees.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $kinora_server http://server:3000;

  # API (ingest, auth, slack), tRPC, and artifacts -> server container.
  location /api/ {
    proxy_pass $kinora_server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /trpc/ {
    proxy_pass $kinora_server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /artifacts/ {
    proxy_pass $kinora_server;
    proxy_set_header Host $host;
    proxy_buffering off; # stream trace.zip + honor Range
  }
  location = /healthcheck {
    proxy_pass $kinora_server;
  }

  # Private dashboard, not content: let crawlers see the noindex headers below.
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
  }

  # TLS terminates upstream, so an absolute Location would downgrade to http.
  absolute_redirect off;

  # Bare /trace -> /trace/ (the viewer is served with base /trace/).
  location = /trace {
    return 301 /trace/;
  }

  # Service worker controls trace parsing, so never serve a stale copy after viewer upgrades.
  location = /trace/sw.bundle.js {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  # Embedded trace viewer (built with base /trace/: its own index, assets, sw).
  location /trace/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /trace/index.html;
    # No hashed names here (index.html, fixtures/*.zip): revalidate so a deploy is picked up at once.
    add_header Cache-Control "no-cache" always;
    # Viewer renders untrusted recorded content in sandboxed iframes + a SW that range-fetches
    # the trace zip; resource directives stay open, only harden the rest.
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Web hashed assets - immutable, long cache.
  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Build id polled by open tabs to notice a deploy (src/lib/updates.ts): never cache it.
  location = /version.json {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  # Web SPA - vue-router history fallback.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # index.html names the hashed bundle: revalidate so a reload always picks up the latest deploy.
    add_header Cache-Control "no-cache" always;
    # Single origin: API is proxied same-origin (connect 'self'). img https: = social-login avatars.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
