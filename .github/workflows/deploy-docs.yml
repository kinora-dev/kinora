name: Deploy docs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        type: string
        default: latest
        required: true
      no_cache:
        description: Build without Docker cache
        type: boolean
        default: true
      trigger_deploy:
        description: Trigger Dokploy after pushing the image
        type: boolean
        default: true
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      no_cache: ${{ steps.meta.outputs.no_cache }}
      trigger_deploy: ${{ steps.meta.outputs.trigger_deploy }}
    steps:
      - name: Resolve deploy metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag || 'latest' }}
          INPUT_NO_CACHE: ${{ inputs.no_cache || false }}
          INPUT_TRIGGER_DEPLOY: ${{ inputs.trigger_deploy || false }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WORKFLOW_RUN_HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || '' }}
        run: |
          set -euo pipefail

          deploy_sha="$GITHUB_SHA"

          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            deploy_sha="$WORKFLOW_RUN_HEAD_SHA"
            subject="${WORKFLOW_RUN_HEAD_COMMIT_MESSAGE%%$'\n'*}"
            echo "Commit subject: $subject"

            if [ -z "$deploy_sha" ]; then
              echo "Release workflow did not expose a head SHA." >&2
              exit 1
            fi

            if [[ ! "$subject" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Release workflow did not run for a release commit, skipping docs deploy."
              exit 0
            fi

            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"
            echo "no_cache=false" >> "$GITHUB_OUTPUT"
            echo "trigger_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "no_cache=$INPUT_NO_CACHE" >> "$GITHUB_OUTPUT"
          echo "trigger_deploy=$INPUT_TRIGGER_DEPLOY" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push docs image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docs
          file: ./docs/Dockerfile
          platforms: linux/amd64
          network: host
          no-cache: ${{ needs.prepare.outputs.no_cache }}
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCS_IMAGE }}:${{ needs.prepare.outputs.tag }}

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_DOCS_COMPOSE_ID }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCS_IMAGE: ${{ secrets.DOCS_IMAGE }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TRIGGER_DEPLOY: ${{ needs.prepare.outputs.trigger_deploy }}
        run: |
          set -euo pipefail

          if [ "$TRIGGER_DEPLOY" != "true" ]; then
            echo "Dokploy trigger disabled."
            exit 0
          fi

          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_DOCS_COMPOSE_ID must be configured."
            exit 1
          fi

          DOKPLOY_DEPLOY_URL="$DOKPLOY_URL/api/compose.deploy"

          PAYLOAD=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "Deploy kinora docs" \
            --arg description "GitHub Actions run $GITHUB_RUN_NUMBER: $DOCKER_REGISTRY/$DOCS_IMAGE:$TAG" \
            '{ composeId: $composeId, title: $title, description: $description }')

          curl -fsSL -X POST "$DOKPLOY_DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            --data "$PAYLOAD"
