name: Deploy cloud

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        type: string
        default: latest
        required: true
      deploy_web:
        description: Build and deploy the web image
        type: boolean
        default: true
      deploy_server:
        description: Build and deploy the server image
        type: boolean
        default: true
      deploy_demo:
        description: Build and deploy the demo web image
        type: boolean
        default: true
      trigger_deploy:
        description: Trigger Dokploy after pushing images
        type: boolean
        default: true
      no_cache:
        description: Build without Docker cache
        type: boolean
        default: false
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      deploy_web: ${{ steps.meta.outputs.deploy_web }}
      deploy_server: ${{ steps.meta.outputs.deploy_server }}
      deploy_demo: ${{ steps.meta.outputs.deploy_demo }}
      trigger_deploy: ${{ steps.meta.outputs.trigger_deploy }}
      no_cache: ${{ steps.meta.outputs.no_cache }}
    steps:
      - name: Resolve deploy metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag || 'latest' }}
          INPUT_DEPLOY_WEB: ${{ inputs.deploy_web || false }}
          INPUT_DEPLOY_SERVER: ${{ inputs.deploy_server || false }}
          INPUT_DEPLOY_DEMO: ${{ inputs.deploy_demo || false }}
          INPUT_TRIGGER_DEPLOY: ${{ inputs.trigger_deploy || false }}
          INPUT_NO_CACHE: ${{ inputs.no_cache || false }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WORKFLOW_RUN_HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || '' }}
        run: |
          set -euo pipefail

          deploy_sha="$GITHUB_SHA"

          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            deploy_sha="$WORKFLOW_RUN_HEAD_SHA"
            subject="${WORKFLOW_RUN_HEAD_COMMIT_MESSAGE%%$'\n'*}"
            echo "Commit subject: $subject"

            if [ -z "$deploy_sha" ]; then
              echo "Release workflow did not expose a head SHA." >&2
              exit 1
            fi

            if [[ ! "$subject" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Release workflow did not run for a release commit, skipping cloud deploy."
              exit 0
            fi

            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"
            echo "deploy_web=true" >> "$GITHUB_OUTPUT"
            echo "deploy_server=true" >> "$GITHUB_OUTPUT"
            echo "deploy_demo=true" >> "$GITHUB_OUTPUT"
            echo "trigger_deploy=true" >> "$GITHUB_OUTPUT"
            echo "no_cache=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "deploy_web=$INPUT_DEPLOY_WEB" >> "$GITHUB_OUTPUT"
          echo "deploy_server=$INPUT_DEPLOY_SERVER" >> "$GITHUB_OUTPUT"
          echo "deploy_demo=$INPUT_DEPLOY_DEMO" >> "$GITHUB_OUTPUT"
          echo "trigger_deploy=$INPUT_TRIGGER_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "no_cache=$INPUT_NO_CACHE" >> "$GITHUB_OUTPUT"

  web:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.deploy_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/web/Dockerfile
          platforms: linux/amd64
          no-cache: ${{ needs.prepare.outputs.no_cache }}
          push: true
          provenance: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.WEB_IMAGE }}:${{ needs.prepare.outputs.tag }}
          build-args: |
            VITE_KINORA_SERVER_URL=https://api.kinora.dev
            VITE_KINORA_CLOUD=true
            VITE_KINORA_SENTRY_DSN=${{ vars.WEB_SENTRY_DSN }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.WEB_SENTRY_PROJECT }}
            VITE_UMAMI_WEBSITE_ID=3324f96d-2efa-44a6-af16-a829f3626864
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  demo-web:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.deploy_demo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push demo web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/web/Dockerfile
          platforms: linux/amd64
          no-cache: ${{ needs.prepare.outputs.no_cache }}
          push: true
          provenance: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DEMO_WEB_IMAGE }}:${{ needs.prepare.outputs.tag }}
          build-args: |
            NGINX_CONF=selfhost/nginx.conf
            VITE_KINORA_SERVER_URL=https://demo.kinora.dev
            VITE_KINORA_CLOUD=false

  # The demo stack runs the demo web image + the shared server image, so it deploys only after the
  # server deploy path has completed or was intentionally skipped.
  demo-deploy:
    needs: [prepare, demo-web, server, server_deploy]
    # server is skipped when deploy_server is off: still deploy, but never after a failed build/deploy.
    if: ${{ !cancelled() && needs.demo-web.result == 'success' && needs.server.result != 'failure' && needs.server_deploy.result != 'failure' && needs.prepare.outputs.trigger_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger demo web deploy in Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_DEMO_WEB_COMPOSE_ID }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DEMO_WEB_IMAGE: ${{ secrets.DEMO_WEB_IMAGE }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "DOKPLOY_DEMO_WEB_COMPOSE_ID is not configured, skipping demo deploy trigger."
            exit 0
          fi

          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "DOKPLOY_URL and DOKPLOY_API_KEY must be configured."
            exit 1
          fi

          DOKPLOY_DEPLOY_URL="$DOKPLOY_URL/api/compose.deploy"

          PAYLOAD=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "Deploy kinora demo web" \
            --arg description "GitHub Actions run $GITHUB_RUN_NUMBER: $DOCKER_REGISTRY/$DEMO_WEB_IMAGE:$TAG" \
            '{ composeId: $composeId, title: $title, description: $description }')

          curl -fsSL -X POST "$DOKPLOY_DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            --data "$PAYLOAD"

  server:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.deploy_server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64
          no-cache: ${{ needs.prepare.outputs.no_cache }}
          push: true
          provenance: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.SERVER_IMAGE }}:${{ needs.prepare.outputs.tag }}

  server_deploy:
    needs: [prepare, server]
    if: ${{ !cancelled() && needs.server.result == 'success' && needs.prepare.outputs.trigger_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger server deploy in Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_SERVER_COMPOSE_ID }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          SERVER_IMAGE: ${{ secrets.SERVER_IMAGE }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "DOKPLOY_URL and DOKPLOY_API_KEY must be configured."
            exit 1
          fi

          if [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "DOKPLOY_SERVER_COMPOSE_ID must be configured."
            exit 1
          fi

          DOKPLOY_DEPLOY_URL="$DOKPLOY_URL/api/compose.deploy"

          PAYLOAD=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "Deploy kinora server" \
            --arg description "GitHub Actions run $GITHUB_RUN_NUMBER: $DOCKER_REGISTRY/$SERVER_IMAGE:$TAG" \
            '{ composeId: $composeId, title: $title, description: $description }')

          curl -fsSL -X POST "$DOKPLOY_DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            --data "$PAYLOAD"

  web_deploy:
    needs: [prepare, web, server, server_deploy]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.server.result != 'failure' && needs.server_deploy.result != 'failure' && needs.prepare.outputs.trigger_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger web deploy in Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_WEB_COMPOSE_ID }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          WEB_IMAGE: ${{ secrets.WEB_IMAGE }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "DOKPLOY_URL and DOKPLOY_API_KEY must be configured."
            exit 1
          fi

          if [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "DOKPLOY_WEB_COMPOSE_ID must be configured."
            exit 1
          fi

          DOKPLOY_DEPLOY_URL="$DOKPLOY_URL/api/compose.deploy"

          PAYLOAD=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "Deploy kinora web" \
            --arg description "GitHub Actions run $GITHUB_RUN_NUMBER: $DOCKER_REGISTRY/$WEB_IMAGE:$TAG" \
            '{ composeId: $composeId, title: $title, description: $description }')

          curl -fsSL -X POST "$DOKPLOY_DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            --data "$PAYLOAD"
