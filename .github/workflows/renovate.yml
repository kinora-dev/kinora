name: Renovate

# Self-hosted Renovate, configured by renovate.json. Do not also enable the Mend Renovate app on
# this repo: both would push to the same `renovate/*` branches.
on:
  # Every 6 hours. renovate.json lifts Renovate's default of 2 new PRs per hour (it would cap
  # each run at 2) and keeps at most 10 open at once.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]
      dryRun:
        description: Look up updates without opening or changing pull requests
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Short-lived token of the kinora-bot GitHub App: pull requests are opened as kinora-bot[bot],
      # still trigger CI (unlike the default token), and nothing expires.
      - name: Get the kinora-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.KINORA_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KINORA_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Renovate
        if: ${{ !inputs.dryRun }}
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The repo already has renovate.json and its dependency dashboard.
          RENOVATE_ONBOARDING: 'false'
          # Commits signed as the app's bot user, and made through the API so GitHub verifies them.
          RENOVATE_GIT_AUTHOR: 'kinora-bot[bot] <340689985+kinora-bot[bot]@users.noreply.github.com>'
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

      - name: Renovate (dry run)
        if: ${{ inputs.dryRun }}
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_DRY_RUN: full
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
