name: Docker Release

# Manual: publishes the self-host images so `docker compose up -d` needs no build.
#   ghcr.io/kinora-dev/kinora-server:<version>
#   ghcr.io/kinora-dev/kinora-web:<version>
# Each architecture builds on its own native runner (emulating the vite/rolldown build under QEMU
# is both slow and crash-prone), then `manifest` stitches the per-arch digests into one tag.
# First run only: flip both packages to public in the org's GHCR package settings.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish, e.g. 0.1.0
        required: true
      latest:
        description: Also move the `latest` tag to this build
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server
            dockerfile: packages/server/Dockerfile
            args: ''
          - name: web
            dockerfile: packages/web/Dockerfile
            # Self-host is single-origin: bake the reverse-proxy config, leave the server URL unset.
            args: NGINX_CONF=selfhost/nginx.conf
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the tags are applied by the manifest job below.
      - name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.args }}
          platforms: linux/${{ matrix.platform.arch }}
          # Attestations would add manifests that imagetools can't fold into the arch list.
          provenance: false
          outputs: type=image,name=ghcr.io/kinora-dev/kinora-${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image.name }}-${{ matrix.platform.arch }}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch manifest
        env:
          IMAGE: ghcr.io/kinora-dev/kinora-${{ matrix.image }}
          VERSION: ${{ inputs.version }}
          MOVE_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$VERSION")
          if [ "$MOVE_LATEST" = 'true' ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          sources=()
          for digest in /tmp/digests/*; do
            sources+=("$IMAGE@$(cat "$digest")")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
