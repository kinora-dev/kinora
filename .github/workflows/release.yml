name: Release

# Automatic global release: bump package.json and packages/desktop/package.json to the
# same new version, then push a commit with subject `release: x.y.z`. After CI passes
# on main, this publishes the desktop assets to a draft GitHub Release and the
# self-host Docker images to GHCR with the same version.
on:
  workflow_dispatch:
    inputs:
      latest:
        description: Also move the Docker `latest` tag to this build
        type: boolean
        default: true
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"

          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            SUBJECT="$(git log -1 --pretty=%s)"
            echo "Commit subject: $SUBJECT"

            if [[ ! "$SUBJECT" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Commit subject does not match ^release: x.y.z, skipping release."
              exit 0
            fi

            COMMIT_VERSION="${BASH_REMATCH[1]}"
            if [ "$ROOT_VERSION" != "$COMMIT_VERSION" ]; then
              echo "Commit subject version ($COMMIT_VERSION) must match package.json version ($ROOT_VERSION)." >&2
              exit 1
            fi
          fi

          if [ "$ROOT_VERSION" != "$DESKTOP_VERSION" ]; then
            echo "Root package.json version ($ROOT_VERSION) must match packages/desktop/package.json ($DESKTOP_VERSION)." >&2
            exit 1
          fi

          if ! [[ "$ROOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be plain semver x.y.z, got: $ROOT_VERSION" >&2
            exit 1
          fi

          LATEST_VERSION="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n 's/^v//p' \
            | sort -V \
            | tail -1)"

          node - "$ROOT_VERSION" "$LATEST_VERSION" <<'NODE'
          const current = process.argv[2]
          const latest = process.argv[3]
          const parse = (version) => version.split('.').map(Number)

          if (!latest)
            process.exit(0)

          const [currentMajor, currentMinor, currentPatch] = parse(current)
          const [latestMajor, latestMinor, latestPatch] = parse(latest)
          const diff = currentMajor - latestMajor || currentMinor - latestMinor || currentPatch - latestPatch

          if (diff <= 0) {
            console.error(`Release version ${current} must be greater than the latest published release ${latest}.`)
            process.exit(1)
          }
          NODE

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$ROOT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$ROOT_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release version: $ROOT_VERSION"

  draft:
    needs: validate
    if: ${{ needs.validate.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "kinora $TAG"

  desktop:
    needs: [validate, draft]
    if: ${{ needs.validate.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build trace viewer + desktop
        shell: bash
        run: |
          pnpm --filter @kinora/trace-viewer build
          pnpm --filter @kinora/desktop build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
          # Bundled trace viewer reports to the desktop project (public DSN, same as config.ts).
          VITE_KINORA_SENTRY_DSN: https://c310f2e5a017909d63b1977ea90149a9@o1155685.ingest.us.sentry.io/4511622840451072

      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/kinora-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/kinora-signing-cert.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          export CERT_PATH

          python3 <<'PY'
          import base64
          import os
          import pathlib
          import shutil
          import urllib.request

          link = os.environ['MAC_CSC_LINK']
          cert_path = pathlib.Path(os.environ['CERT_PATH'])

          if link.startswith(('http://', 'https://')):
              urllib.request.urlretrieve(link, cert_path)
          elif pathlib.Path(link).exists():
              shutil.copy(link, cert_path)
          else:
              data = link.split(',', 1)[1] if link.startswith('data:') else link
              cert_path.write_bytes(base64.b64decode(data))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Package, sign, notarize, publish
        working-directory: packages/desktop
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish always
        env:
          # mac notarization only; signing uses CSC_KEYCHAIN from the import step.
          # Win/linux ship unsigned for now (no code-signing cert yet).
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    needs: validate
    if: ${{ needs.validate.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server
            dockerfile: packages/server/Dockerfile
            args: ''
          - name: web
            dockerfile: packages/web/Dockerfile
            # Self-host is single-origin: bake the reverse-proxy config, leave the server URL unset.
            args: NGINX_CONF=selfhost/nginx.conf
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the tags are applied by the manifest job below.
      - name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.args }}
          platforms: linux/${{ matrix.platform.arch }}
          # Attestations would add manifests that imagetools can't fold into the arch list.
          provenance: false
          outputs: type=image,name=ghcr.io/kinora-dev/kinora-${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image.name }}-${{ matrix.platform.arch }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  docker-manifest:
    needs: [validate, desktop, docker-build]
    if: ${{ needs.validate.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch manifest
        env:
          IMAGE: ghcr.io/kinora-dev/kinora-${{ matrix.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          MOVE_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$VERSION")
          move_latest='true'
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            move_latest="$MOVE_LATEST"
          fi
          if [ "$move_latest" = 'true' ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          sources=()
          for digest in /tmp/digests/*; do
            sources+=("$IMAGE@$(cat "$digest")")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
