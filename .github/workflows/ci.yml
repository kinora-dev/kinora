name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - .gitignore
  pull_request:
    paths-ignore:
      - .gitignore

permissions:
  contents: read

# satisfy validate-env on the web build.
env:
  VITE_KINORA_SERVER_URL: http://localhost:3000

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Skips the jobs a change can't affect. Skipped jobs count as passing for the required checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `every`: a file matches a filter only if it matches all of its patterns.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!website/**'
              - '!**/*.md'
            docs:
              - '{docs/**,.github/workflows/ci.yml}'
            website:
              - '{website/**,.github/workflows/ci.yml}'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check vendored Playwright trace viewer
        run: pnpm vendor:playwright-trace:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # website is a standalone Astro workspace (own lockfile), so pnpm -r above never touches it.
  # Lint is already covered by the root eslint .; this catches astro type errors + a broken build.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  integration_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: kinora
          POSTGRES_PASSWORD: kinora
          POSTGRES_DB: kinora
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U kinora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # S3-compatible test server for storage integration tests.
      - name: Start S3 mock
        run: |
          docker run -d --name s3mock -p 9000:9090 \
            -e initialBuckets=kinora-test \
            adobe/s3mock:latest
          timeout 30 sh -c 'until curl -sf http://localhost:9000/; do sleep 1; done'

      # test-env falls back to the dev-compose defaults (kinora @ localhost:5436), which match the service.
      - name: Integration tests
        run: pnpm --filter @kinora/server test:coverage

  # One runner per suite (and two web shards): sharing a runner, the suites competed for its CPU.
  # Splits the web e2e suite by the durations of its nightly runs (kinora-web-e2e) instead of by test
  # count, so both shards take about as long. Planned once: shards planned apart could read different
  # durations and skip or repeat tests.
  shard_plan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: List the web e2e tests
        run: pnpm --filter @kinora/web exec playwright test --list --reporter=json > "$RUNNER_TEMP/list.json"

      # The CLI from this checkout. Without the token (pull requests from forks) the plan falls back
      # to the list itself, which has no durations: a split by test count, like --shard.
      - name: Plan the shards
        env:
          KINORA_TOKEN: ${{ secrets.KINORA_TOKEN }}
        run: |
          if [ -n "$KINORA_TOKEN" ]; then source=(--project kinora-web-e2e); else source=(--from-report "$RUNNER_TEMP/list.json"); fi
          pnpm --filter @kinora/cli exec tsx src/kinora.ts shard --list "$RUNNER_TEMP/list.json" --total 2 --granularity test --out-dir "$GITHUB_WORKSPACE/shards" "${source[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shards
          path: shards/
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.name }})
    needs: [changes, shard_plan]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: viewer
            package: '@kinora/trace-viewer'
          - name: web 1/2
            package: '@kinora/web'
            shard: 1
          - name: web 2/2
            package: '@kinora/web'
            shard: 2
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: kinora
          POSTGRES_PASSWORD: kinora
          POSTGRES_DB: kinora
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U kinora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VITE_KINORA_SERVER_URL: http://localhost:3399
      NODE_ENV: development
      PORT: '3399'
      BASE_URL: http://localhost:3399
      WEB_ORIGIN: http://localhost:5399
      AUTH_SECRET: ci-e2e-secret-not-used-for-anything-real
      POSTGRES_USER: kinora
      POSTGRES_PASSWORD: kinora
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5436'
      POSTGRES_DB: kinora_e2e
      STORAGE_DIR: .data/artifacts
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      KINORA_CLOUD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the Playwright version, so unrelated lockfile changes keep the cache.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Azure can trickle data for minutes without hitting apt's inactivity timeout.
      # The runner's mirror list also feeds Playwright's install-deps on browser cache hits.
      - name: Use Ubuntu archive mirror
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          printf 'Acquire::http::Timeout "10";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts

      # On a cache hit the browser binary is restored; OS deps live system-wide and aren't cached.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kinora/web exec playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @kinora/web exec playwright install-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.shard
        with:
          name: shards
          path: shards/

      # The web test:e2e resets kinora_e2e + self-boots the stack on dedicated ports (same as local).
      - name: E2E
        run: pnpm --filter '${{ matrix.package }}' test:e2e ${{ matrix.shard && format('--test-list {0}/shards/shard-{1}.txt', github.workspace, matrix.shard) || '' }}

  # Single required check over the e2e matrix, whose job names carry the matrix values.
  e2e_tests:
    needs: [changes, shard_plan, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check e2e results
        if: needs.changes.result != 'success' || contains(fromJSON('["failure", "cancelled"]'), needs.shard_plan.result) || contains(fromJSON('["failure", "cancelled"]'), needs.e2e.result)
        run: exit 1

  # @kinora/ui component + visual tests and the Vitest reporter contract, in parallel with e2e_tests.
  # No database: they need the gallery's dev server, Docker (for the browser that renders the visual
  # tests) and a local fake kinora server.
  component_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/ui/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Fetched in the background while the browser installs and the component tests run, so the
      # visual tests that follow find the image ready.
      - name: Pull the Playwright image for visual tests
        run: docker pull -q "mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble" > /tmp/playwright-image.log 2>&1 &

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Azure can trickle data for minutes without hitting apt's inactivity timeout.
      # The runner's mirror list also feeds Playwright's install-deps on browser cache hits.
      - name: Use Ubuntu archive mirror
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          printf 'Acquire::http::Timeout "10";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kinora/ui exec playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @kinora/ui exec playwright install-deps chromium

      - name: Component + visual tests
        run: pnpm --filter @kinora/ui test:e2e

      # Real Vitest browser mode and Storybook through @kinora/vitest-reporter, against a fake server.
      - name: Vitest reporter contract
        run: pnpm --filter @kinora/vitest-contract test:e2e
