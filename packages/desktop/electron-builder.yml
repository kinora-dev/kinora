appId: dev.kinora.desktop
productName: kinora
directories:
  output: release
  buildResources: build

# Compiled main/preload + the package manifest. The renderer (trace viewer) is
# shipped as a resource, not packed into the asar.
files:
  - dist/**
  - package.json

# Static renderers served by the loopback server at runtime (resolve*Dir() ->
# resourcesPath/<name> when packaged): the trace viewer and the home UI.
extraResources:
  - from: ../trace-viewer/dist
    to: viewer
  - from: home/dist
    to: home

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Signing in CI via CSC_LINK / CSC_KEY_PASSWORD; notarize via
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (see release workflow).
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: kinora ${version}
  icon: build/icon.icns
  background: build/dmg-background.png
  window:
    width: 700
    height: 520
  iconSize: 120
  iconTextSize: 13
  contents:
    - x: 185
      y: 210
      type: file
    - x: 515
      y: 210
      type: link
      path: /Applications

win:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  target:
    - nsis

linux:
  executableName: kinora
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - AppImage

publish:
  provider: github
  owner: kinora-dev
  repo: kinora
