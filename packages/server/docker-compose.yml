name: kinora
services:
  pg:
    container_name: kinora_postgres
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_USER: kinora
      POSTGRES_PASSWORD: kinora
      POSTGRES_DB: kinora
    ports:
      - '5436:5432'

  # S3-compatible store for exercising the S3 storage path; storage-s3.test.ts targets it on :9000.
  minio:
    container_name: kinora_minio
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000'
